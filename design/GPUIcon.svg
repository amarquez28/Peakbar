<svg width="30" height="18" viewBox="0 0 30 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom two-fan graphics card glyph for compact mode (template image).
       Outline style to match Apple's SF Symbols. Color is ignored by macOS;
       only the alpha (the strokes) is used. -->
  <g fill="none" stroke="#000000" stroke-width="1.7" stroke-linejoin="round">
    <!-- card / shroud -->
    <rect x="2.5" y="3.5" width="25" height="11" rx="2.2"/>
    <!-- two fans -->
    <circle cx="10" cy="9" r="3.4"/>
    <circle cx="20" cy="9" r="3.4"/>
  </g>
  <!-- fan hubs -->
  <circle cx="10" cy="9" r="1" fill="#000000"/>
  <circle cx="20" cy="9" r="1" fill="#000000"/>
</svg>
